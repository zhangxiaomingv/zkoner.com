name: 检测系统 · AI 可见度监测

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/visibility/package-lock.json

      - name: 安装依赖
        working-directory: tools/visibility
        run: npm ci

      - name: 运行可见度监测
        working-directory: tools/visibility
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: npm run run

      - name: 提交监测结果
        run: |
          git config user.name "visibility-bot"
          git config user.email "visibility-bot@users.noreply.github.com"
          git add tools/visibility/data
          git commit -m "monitor: AI 可见度周报 $(date +%F)" || echo "本次无变化"
          git push
