<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0a0a0b;
    color: #f5f5f6;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* 顶部科技蓝微光 */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(55% 50% at 50% -5%, rgba(76,141,255,.16) 0%, rgba(76,141,255,0) 70%);
  }
  /* 极淡网格 */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(70% 70% at 50% 0%, #000 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(70% 70% at 50% 0%, #000 0%, transparent 100%);
  }
  .content { position: relative; padding: 76px 80px; }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-size: 18px; letter-spacing: .35em; color: #4c8dff;
  }
  .eyebrow::before { content: ""; width: 44px; height: 2px; background: #4c8dff; }
  .name { font-size: 92px; font-weight: 600; letter-spacing: -.02em; margin-top: 34px; }
  .role { font-size: 30px; color: #a1a1aa; margin-top: 20px; font-weight: 300; letter-spacing: .06em; }
  .mission { font-size: 22px; color: #71717a; margin-top: 14px; letter-spacing: .02em; }
  .dot { color: #4c8dff; }
  .footer {
    position: absolute; bottom: 64px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; color: #71717a; letter-spacing: .1em;
  }
  .bar { width: 2px; height: 22px; background: #2a2a30; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow">AI 时代个人创业探索者</div>
    <div class="name">张晓明</div>
    <div class="role">AI 顾问 · 企业 AI 转型观察者</div>
    <div class="mission">用 AI 探索个人与企业的新可能<span class="dot">。</span></div>
  </div>
  <div class="footer">
    <div>让每一次相遇，都产生新的可能</div>
    <div style="display:flex; align-items:center; gap:16px">
      <span>ZKONER.COM</span><span class="bar"></span><span>遇见·可能</span>
    </div>
  </div>
</body>
</html>
