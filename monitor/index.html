<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优引GEO · AI监测控制台</title>
  <meta name="description" content="优引GEO系统 AI监测控制台 — 品牌可见度、竞争格局、引用追踪、场景洞察与优化建议。本地部署 · Claude Code + n8n 驱动。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ═══ 侧边栏 ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">优</div>
      <div class="brand-text">
        <strong>优引GEO</strong>
        <span>AI监测控制台</span>
      </div>
    </div>

    <nav class="side-nav" id="sideNav">
      <!-- 由 JS 渲染菜单 -->
    </nav>

    <div class="sidebar-footer">
      <div class="sys-status" id="sysStatus">
        <span class="dot on"></span> 本地监测正常
      </div>
      <div class="sys-meta" id="sysMeta">数据更新: --</div>
    </div>
  </aside>

  <!-- ═══ 主内容 ═══ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuToggle" aria-label="菜单">☰</button>
      <div class="crumb" id="crumb">AI监测</div>
      <div class="topbar-actions">
        <span class="live-badge"><span class="dot on"></span> LIVE</span>
        <button class="btn btn-primary" id="btnRunMonitor">立即监测</button>
      </div>
    </header>

    <div class="content" id="content"><!-- 页面由 JS 渲染 --></div>
  </main>

  <!-- 移动端遮罩 -->
  <div class="scrim" id="scrim"></div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
